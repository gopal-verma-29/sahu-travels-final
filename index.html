<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--seo:begin--><!--seo:end-->
    <meta name="theme-color" content="#F6C000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Intro loader, part 1 of 3: styles. Plain colours rather than the Tailwind tokens, because
         this has to look right before the app's own stylesheet is parsed. They are the same
         values: plate #F6C000, asphalt #24272C, wash #F2F4F1. Hidden unless part 3 switches it on.

         Three things here exist only to stop it jittering. Keep them if you copy this to another project:
         1. The loader has its own copy of the display typeface, under its own name. Waiting for the app's
            stylesheet (it arrives late in `npm run dev`) meant the name was drawn in a stand-in font and
            then swapped. Point the url() at your project's display font.
         2. The loader is `width: 100vw`, not `inset: 0`. When the page renders behind it, a desktop
            scrollbar appears and the window gets narrower; a loader sized to the window would shift sideways.
         3. Everything that moves is transform or opacity on its own layer (will-change), and nothing
            repeats: a looping pattern shows every dropped frame. -->
    <style>
      @font-face {
        font-family: 'Sahu Intro';
        font-style: normal;
        font-weight: 300 700;
        font-display: block;
        src: url(/node_modules/@fontsource-variable/teko/files/teko-latin-wght-normal.woff2) format('woff2-variations');
      }

      .intro {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100vw;
        z-index: 1000;
        display: none;
        place-items: center;
        overflow: hidden;
        background: #f6c000;
        color: #24272c;
        touch-action: none;
        overscroll-behavior: none;
        will-change: transform;
        transition: transform 0.85s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .intro.is-on {
        display: grid;
      }
      .intro.is-lift {
        transform: translateY(-102%);
        pointer-events: none;
      }

      /* The road along the bottom edge. Its centre dashes are laid down once, as the name appears, and
         then stay put. The road is the last thing to leave: the yellow lifts away with it as its edge. */
      .intro-road {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 1.5rem;
        overflow: hidden;
        background: #24272c;
      }
      .intro-road::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 4px;
        margin-top: -2px;
        background: repeating-linear-gradient(90deg, #f6c000 0 28px, transparent 28px 56px);
        will-change: transform;
        animation: intro-road 0.95s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .intro-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        margin-top: -4vh;
        will-change: transform, opacity;
        transition:
          transform 0.85s cubic-bezier(0.65, 0, 0.35, 1),
          opacity 0.45s ease-in;
      }
      .intro.is-lift .intro-center {
        transform: translateY(-16vh);
        opacity: 0;
      }

      .intro-mark {
        display: block;
        width: clamp(4.5rem, 15vw, 6.5rem);
        height: auto;
        will-change: transform, opacity;
        animation: intro-plant 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      /* The name rises through a mask, the way the headlines do on the pages. It waits for its typeface
         (class is-go, added by part 3), so it is never seen in a stand-in font. */
      .intro-name {
        margin: 0;
        font: 600 clamp(3.5rem, 17vw, 7rem) / 0.95 'Sahu Intro', 'Teko Variable', 'Arial Narrow', sans-serif;
        letter-spacing: 0.01em;
        text-align: center;
        white-space: nowrap;
      }
      .intro-mask {
        display: block;
        overflow: hidden;
        padding: 0.14em 0.04em 0.06em;
      }
      .intro-rise {
        display: block;
        will-change: transform;
        transform: translateY(115%);
      }
      .intro.is-go .intro-rise {
        animation: intro-rise 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      @keyframes intro-plant {
        from {
          opacity: 0;
          transform: translateY(1rem);
        }
      }
      @keyframes intro-rise {
        from {
          transform: translateY(115%);
        }
        to {
          transform: none;
        }
      }
      @keyframes intro-road {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce), print {
        .intro {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Part 2 of 3: markup. The mark is the favicon's shape. Keep the name in step with business.name
         in src/content.js. Hidden from assistive technology: it is a few seconds of decoration over
         a page that is not there yet. -->
    <div class="intro" aria-hidden="true">
      <div class="intro-center">
        <svg class="intro-mark" viewBox="0 0 32 32" focusable="false">
          <rect width="32" height="32" rx="6" fill="#24272C" />
          <path d="M9 26V15a7 7 0 0 1 14 0v11z" fill="#F6C000" />
          <rect x="9" y="19" width="14" height="7" fill="#F2F4F1" />
        </svg>
        <p class="intro-name"><span class="intro-mask"><span class="intro-rise">Sahu Travels</span></span></p>
      </div>
      <div class="intro-road"></div>
    </div>

    <div id="root"></div>

    <!-- Part 3 of 3: the controller. It runs before the app's code does, so it covers the real wait (the
         app downloading), then lifts the curtain once the first page has rendered and the browser has
         gone quiet. It follows the animations rather than a stopwatch, so a slow phone never lifts the
         curtain halfway through the name. Nothing here can trap a reader: a timer ends it after 6
         seconds whatever else happens. -->
    <script>
      ;(() => {
        const KEY = 'sahu-intro' // sessionStorage key: rename it in each project
        const HOLD = 450 // how long the finished name stays up so it can be read, in ms
        const GIVE_UP = 6000 // the most it stays on screen, in ms

        const loader = document.querySelector('.intro')
        const root = document.getElementById('root')
        if (!loader || !root) return

        // Never for readers who ask for reduced motion. Otherwise once per browser session: add
        // ?intro to the address to see it again.
        let show = !matchMedia('(prefers-reduced-motion: reduce)').matches
        if (show) {
          try {
            show = !sessionStorage.getItem(KEY) || /[?&]intro\b/.test(location.search)
            sessionStorage.setItem(KEY, '1')
          } catch (e) {
            // storage is blocked (some private modes): better to show it than to guess
          }
        }
        if (!show) {
          loader.remove()
          return
        }

        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
        const frames = (n) =>
          new Promise((resolve) => {
            const step = () => (n-- > 0 ? requestAnimationFrame(step) : resolve())
            step()
          })
        const idle = () =>
          new Promise((resolve) =>
            'requestIdleCallback' in window ? requestIdleCallback(resolve, { timeout: 500 }) : setTimeout(resolve, 120),
          )

        const held = [] // the page's own entrance animations, parked until the curtain is on its way
        let lifted = false
        const lift = () => {
          if (lifted) return
          lifted = true
          loader.classList.add('is-lift') // the curtain goes up (0.85 s, in the CSS)
          root.removeAttribute('inert')
          setTimeout(() => {
            held.forEach((animation) => animation.play()) // the headline and the cab start as the curtain clears them
          }, 380)
          setTimeout(() => loader.remove(), 1000)
        }

        setTimeout(lift, GIVE_UP) // first, so a failure further down can never leave the curtain up
        root.setAttribute('inert', '') // nothing behind the curtain can be tabbed to or tapped
        loader.classList.add('is-on')

        // 1. The name rises as soon as its typeface is in. Wait for the animation itself to finish, then
        //    give it a moment to be read.
        const name = loader.querySelector('.intro-rise')
        const typeface = document.fonts
          ? Promise.race([document.fonts.load('600 1em "Sahu Intro"'), wait(1200)]).catch(() => {})
          : Promise.resolve()
        const entrance = typeface
          .then(
            () =>
              new Promise((resolve) => {
                name.addEventListener('animationend', resolve, { once: true })
                setTimeout(resolve, 1500) // in case the event never comes
                loader.classList.add('is-go')
              }),
          )
          .then(() => wait(HOLD))

        // 2. The first page has rendered into #root (or its error message has: main.jsx writes one there).
        //    Park its entrance animations at their first frame, wait for its fonts, then for a quiet moment,
        //    so nothing heavy is happening on the frame the curtain starts to move.
        const rendered = new Promise((resolve) => {
          if (root.firstChild) return resolve()
          new MutationObserver((_, observer) => {
            observer.disconnect()
            resolve()
          }).observe(root, { childList: true })
        })
          .then(() => {
            if (root.getAnimations && window.CSSAnimation) {
              root.getAnimations({ subtree: true }).forEach((animation) => {
                // Only the page's own one-shot entrance animations that are running right now. An animation that
                // the page's CSS has paused (a poster that is off screen, a form waiting to be scrolled to) or
                // one that loops must stay under CSS control: once .play() is called on it, animation-play-state
                // no longer applies, and it would run for the rest of the visit.
                const timing = animation.effect && animation.effect.getComputedTiming ? animation.effect.getComputedTiming() : null
                if (animation instanceof CSSAnimation && animation.playState === 'running' && timing && timing.iterations !== Infinity) {
                  animation.pause()
                  held.push(animation)
                }
              })
            }
            return frames(2)
          })
          .then(() => document.fonts && Promise.race([document.fonts.ready, wait(2000)]))
          .then(idle)

        Promise.all([entrance, rendered]).then(() => frames(1)).then(lift)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
